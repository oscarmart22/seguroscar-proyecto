<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro - Seguroscar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .forum-container {
            max-width: 800px;
            margin: 120px auto 40px;
            padding: 0 1rem;
        }
        .post-form-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: none;
        }
        .post-form-card h3 { margin-bottom: 1rem; }
        .post-input {
            width: 100%;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            color: var(--color-text);
            font-family: inherit;
            margin-bottom: 1rem;
            resize: vertical;
            box-sizing: border-box;
        }
        .post-input:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .login-prompt {
            text-align: center;
            padding: 2rem;
            background: var(--color-bg-card);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-lg);
            margin-bottom: 2rem;
        }

        .post-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            transition: border-color 0.2s ease;
        }
        .post-card:hover { border-color: var(--color-border-hover); }
        .post-votes {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            min-width: 40px;
            flex-shrink: 0;
        }
        .vote-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            font-size: 1rem;
            line-height: 1;
        }
        .vote-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--color-text); }
        .vote-count { font-weight: 600; font-size: 0.9rem; }

        .post-content-area { flex-grow: 1; min-width: 0; }
        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--color-text-muted);
            flex-wrap: wrap;
            gap: 0.25rem;
        }
        .post-author { font-weight: 600; color: var(--color-text); }
        .post-body { line-height: 1.6; color: var(--color-text); white-space: pre-wrap; word-break: break-word; }

        .post-actions { margin-top: 0.75rem; }
        .btn-reply {
            background: none;
            border: none;
            color: var(--color-primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }
        .btn-reply:hover { text-decoration: underline; }

        /* Reply thread indentation */
        .reply-container {
            margin-left: 2rem;
            border-left: 2px solid rgba(255, 255, 255, 0.08);
            padding-left: 1rem;
            margin-top: 0.75rem;
        }
        .reply-container .post-card {
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .reply-form {
            display: none;
            margin-top: 0.75rem;
        }
        .reply-form.active { display: block; }
        .reply-form .post-input { min-height: 60px; }

        .empty-msg, .error-msg {
            text-align: center;
            padding: 2rem;
        }
        .error-msg { color: var(--color-danger); }
    </style>
</head>
<body>
    <nav class="navbar scrolled" style="background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(24px);">
        <div class="navbar__inner">
            <div class="navbar__left">
                <a href="/" class="navbar__logo" style="gap: 0; align-items: center;">
                    <span style="font-size: 24px; font-weight: 800; letter-spacing: -1px; color: #ffffff;">segur</span>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 1px;">
                        <defs>
                            <linearGradient id="logoBlueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#00d4ff" />
                                <stop offset="100%" stop-color="#0055aa" />
                            </linearGradient>
                        </defs>
                        <rect x="4" y="10" width="16" height="12" rx="3" ry="3" stroke="url(#logoBlueGrad2)" fill="#000000" />
                        <path d="M7 10V6a5 5 0 0 1 10 0v4" stroke="url(#logoBlueGrad2)" />
                        <circle cx="12" cy="16" r="2" fill="url(#logoBlueGrad2)" stroke="none" />
                    </svg>
                    <span style="font-size: 24px; font-weight: 800; letter-spacing: -1px; color: #ffffff;">scar</span>
                </a>
            </div>
            <div class="navbar__right">
                <a href="/" class="navbar__btn navbar__btn--outline">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="forum-container">
        <div class="section__header" style="text-align: left; margin-bottom: 2rem;">
            <h1 class="section__title">Foro de Discusión</h1>
            <p class="section__subtitle">Comparte dudas y opiniones sobre seguridad biométrica.</p>
        </div>

        <div id="loginPrompt" class="login-prompt">
            <p>Debes iniciar sesión para publicar en el foro.</p>
            <a href="/" class="btn btn--primary" style="margin-top: 1rem; display: inline-block;">Ir al inicio a loguearse</a>
        </div>

        <div id="postFormCard" class="post-form-card">
            <h3>Crear una publicación</h3>
            <form id="newPostForm">
                <textarea id="postContent" class="post-input" placeholder="¿Qué tienes en mente?" required></textarea>
                <button type="submit" class="btn btn--primary" id="submitPostBtn">Publicar</button>
                <span id="postMsg" style="margin-left: 1rem; font-size: 0.9rem;"></span>
            </form>
        </div>

        <div id="postsList">
            <p class="empty-msg" style="color: var(--color-text-muted);">Cargando publicaciones...</p>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        let loggedIn = false;
        const postsList = document.getElementById('postsList');

        // ─── Escape HTML to prevent XSS ───
        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ─── Build HTML for a single post + its replies recursively ───
        function buildPostHtml(post) {
            const score = (post.upvotes || 0) - (post.downvotes || 0);
            let repliesHtml = '<div class="reply-container" id="replies-' + post.id + '">';
            if (post.replies && post.replies.length > 0) {
                post.replies.forEach(function(r) { repliesHtml += buildPostHtml(r); });
            }
            repliesHtml += '</div>';

            return '<div class="post-card" id="post-' + post.id + '">'
                + '<div class="post-votes">'
                +   '<button class="vote-btn" data-vote-id="' + post.id + '" data-vote-type="up" title="Upvote">&#9650;</button>'
                +   '<span class="vote-count" id="vote-count-' + post.id + '">' + score + '</span>'
                +   '<button class="vote-btn" data-vote-id="' + post.id + '" data-vote-type="down" title="Downvote">&#9660;</button>'
                + '</div>'
                + '<div class="post-content-area">'
                +   '<div class="post-header">'
                +     '<span class="post-author">' + esc(post.username) + '</span>'
                +     '<span>' + esc(post.timestamp || '') + '</span>'
                +   '</div>'
                +   '<div class="post-body">' + esc(post.content) + '</div>'
                +   '<div class="post-actions">'
                +     '<button class="btn-reply" data-reply-id="' + post.id + '">Responder</button>'
                +   '</div>'
                +   '<form class="reply-form" id="reply-form-' + post.id + '">'
                +     '<textarea class="post-input" style="min-height:60px;" id="reply-content-' + post.id + '" placeholder="Escribe tu respuesta..." required></textarea>'
                +     '<button type="submit" class="btn btn--primary" style="font-size:0.85rem; padding:0.5rem 1rem;" data-submit-reply="' + post.id + '">Responder</button>'
                +   '</form>'
                +   repliesHtml
                + '</div>'
              + '</div>';
        }

        // ─── Load all posts from backend ───
        function loadPosts() {
            fetch('/api/posts')
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(posts) {
                    postsList.innerHTML = '';
                    if (!posts || !Array.isArray(posts) || posts.length === 0) {
                        postsList.innerHTML = '<p class="empty-msg" style="color:var(--color-text-muted);">Aún no hay publicaciones. ¡Sé el primero!</p>';
                        return;
                    }
                    var html = '';
                    posts.forEach(function(post) { html += buildPostHtml(post); });
                    postsList.innerHTML = html;
                })
                .catch(function() {
                    postsList.innerHTML = '<p class="error-msg">Error al cargar las publicaciones. Intenta recargar la página.</p>';
                });
        }

        // ─── Check auth and then load posts ───
        fetch('/api/me')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.logged_in) {
                    loggedIn = true;
                    document.getElementById('loginPrompt').style.display = 'none';
                    document.getElementById('postFormCard').style.display = 'block';
                }
                loadPosts();
            })
            .catch(function() {
                loadPosts();
            });

        // ─── New Post form ───
        document.getElementById('newPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var content = document.getElementById('postContent').value.trim();
            var btn = document.getElementById('submitPostBtn');
            var msg = document.getElementById('postMsg');

            if (!content) return;

            btn.disabled = true;
            msg.style.color = 'var(--color-text-muted)';
            msg.textContent = 'Publicando...';

            fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, parent_id: null })
            })
            .then(function(res) {
                if (!res.ok && res.status === 401) {
                    return res.json().then(function(d) { throw new Error(d.error || 'No autenticado'); });
                }
                return res.json();
            })
            .then(function(data) {
                btn.disabled = false;
                if (data.error) {
                    msg.style.color = 'var(--color-danger)';
                    msg.textContent = data.error;
                    return;
                }
                msg.style.color = '#00ffa3';
                msg.textContent = '¡Publicado!';
                document.getElementById('postContent').value = '';
                setTimeout(function() { msg.textContent = ''; }, 3000);

                // Prepend new post instantly
                if (data.post) {
                    // Remove "no posts" placeholder if present
                    var placeholder = postsList.querySelector('.empty-msg');
                    if (placeholder) placeholder.remove();

                    var tmp = document.createElement('div');
                    tmp.innerHTML = buildPostHtml(data.post);
                    postsList.prepend(tmp.firstElementChild);
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                msg.style.color = 'var(--color-danger)';
                msg.textContent = err.message || 'Error de conexión';
            });
        });

        // ─── Event Delegation for votes, replies, and reply submit ───
        postsList.addEventListener('click', function(e) {
            var target = e.target;

            // VOTE buttons
            if (target.classList.contains('vote-btn')) {
                e.preventDefault();
                var postId = target.getAttribute('data-vote-id');
                var voteType = target.getAttribute('data-vote-type');
                if (!postId || !voteType) return;

                if (!loggedIn) {
                    alert('Debes iniciar sesión para votar.');
                    return;
                }

                // Optimistic update
                var countSpan = document.getElementById('vote-count-' + postId);
                var oldCount = parseInt(countSpan.textContent) || 0;
                countSpan.textContent = voteType === 'up' ? oldCount + 1 : oldCount - 1;

                fetch('/api/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ post_id: parseInt(postId), vote_type: voteType })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.error) {
                        countSpan.textContent = oldCount; // revert
                    }
                })
                .catch(function() {
                    countSpan.textContent = oldCount; // revert
                });
                return;
            }

            // REPLY toggle button
            if (target.classList.contains('btn-reply')) {
                e.preventDefault();
                var replyId = target.getAttribute('data-reply-id');
                if (!loggedIn) {
                    alert('Debes iniciar sesión para responder.');
                    return;
                }
                var form = document.getElementById('reply-form-' + replyId);
                if (form) form.classList.toggle('active');
                return;
            }

            // REPLY submit button
            if (target.getAttribute('data-submit-reply')) {
                // handled by form submit event below
            }
        });

        // Reply form submissions via event delegation
        postsList.addEventListener('submit', function(e) {
            if (!e.target.classList.contains('reply-form')) return;
            e.preventDefault();

            var form = e.target;
            var parentId = form.id.replace('reply-form-', '');
            var contentInput = document.getElementById('reply-content-' + parentId);
            var btn = form.querySelector('button[type="submit"]');
            var content = contentInput.value.trim();

            if (!content) return;

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, parent_id: parseInt(parentId) })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false;
                btn.textContent = 'Responder';
                if (data.error) {
                    alert(data.error);
                    return;
                }
                contentInput.value = '';
                form.classList.remove('active');

                // Append reply instantly
                if (data.post) {
                    var repliesContainer = document.getElementById('replies-' + parentId);
                    if (repliesContainer) {
                        var tmp = document.createElement('div');
                        tmp.innerHTML = buildPostHtml(data.post);
                        repliesContainer.appendChild(tmp.firstElementChild);
                    }
                }
            })
            .catch(function() {
                btn.disabled = false;
                btn.textContent = 'Responder';
                alert('Error de conexión. Intenta de nuevo.');
            });
        });

    })();
    </script>
</body>
</html>
